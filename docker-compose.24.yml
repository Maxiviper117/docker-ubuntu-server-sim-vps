services:
  vps:
    image: ubuntu24-vps-sim
    build:
      context: .
      dockerfile: Dockerfile.24
    env_file:
      - .env    
    environment:
      - SSH_PUB_KEY=${SSH_PUB_KEY}
    ports:
      - "${VPS_SSH_PORT:-2222}:22"
      # Keep the unauthenticated Docker API on localhost. Do not expose this port externally.
      - "127.0.0.1:${VPS_DOCKER_API_PORT:-2375}:2375"
      - "${VPS_HTTP_PORT:-8080}:80"
      - "${VPS_HTTPS_PORT:-8443}:443"
    # Privileged mode supports Docker-in-Docker. It does not provide a security boundary.
    privileged: true
    stdin_open: true
    tty: true
    # Stop after a failure so tests show the real container state.
    restart: "no"
    volumes:
      - vps_docker:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 docker info >/dev/null 2>&1 && timeout 5 bash -c '</dev/tcp/127.0.0.1/22' 2>/dev/null"]
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 6

volumes:
  vps_docker:
    driver: local


